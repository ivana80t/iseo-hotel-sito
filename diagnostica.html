<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostica Header Mobile</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:sans-serif;background:#f5f4f0;}
  header{
    position:sticky;top:0;z-index:100;
    background:rgba(251,250,247,0.92);
    backdrop-filter:blur(10px);
    border-bottom:3px solid #c59827;
    height:76px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;color:#12294f;
  }
  #debug{
    position:fixed;bottom:0;left:0;right:0;z-index:999;
    background:#111;color:#0f0;font-family:monospace;font-size:13px;
    padding:10px;line-height:1.6;
    border-top:2px solid #0f0;
  }
  .content{padding:20px;}
  .block{height:400px;background:#fff;margin-bottom:16px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:24px;color:#999;border:1px solid #ddd;}
</style>
</head>
<body>

<header id="testHeader">HEADER DI TEST (sticky)</header>

<div class="content">
  <div class="block">Blocco 1 — scrolla</div>
  <div class="block">Blocco 2 — continua a scrollare</div>
  <div class="block">Blocco 3</div>
  <div class="block">Blocco 4</div>
  <div class="block">Blocco 5</div>
  <div class="block">Blocco 6</div>
  <div class="block">Blocco 7</div>
  <div class="block">Blocco 8</div>
</div>

<div id="debug">Carico...</div>

<script>
  const debug = document.getElementById('debug');
  const header = document.getElementById('testHeader');

  function update() {
    const rect = header.getBoundingClientRect();
    const vv = window.visualViewport;
    const lines = [
      'scrollY: ' + Math.round(window.scrollY),
      'header.top (dovrebbe essere sempre 0): ' + Math.round(rect.top),
      'header.bottom: ' + Math.round(rect.bottom),
      'innerHeight (layout viewport): ' + window.innerHeight,
      vv ? 'visualViewport.height: ' + Math.round(vv.height) : 'visualViewport: non supportato',
      vv ? 'visualViewport.offsetTop: ' + Math.round(vv.offsetTop) : ''
    ];
    debug.textContent = lines.join(' | ');
  }

  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('scroll', update);
    window.visualViewport.addEventListener('resize', update);
  }
  update();
</script>

</body>
</html>
