# Questo file va spostato in: .github/workflows/refresh.yml
# (GitHub Actions legge solo i workflow dentro quella cartella esatta)
#
# Cosa fa: lancia refresh.js e refresh-ristoranti.js ogni 25 giorni, così i
# dati di strutture e ristoranti non superano mai il limite di cache di
# 30 giorni imposto da Google.
name: Refresh strutture e ristoranti Iseo
on:
  schedule:
    - cron: '0 3 */25 * *'   # ogni 25 giorni, alle 03:00 UTC
  workflow_dispatch:          # permette anche l'avvio manuale da GitHub
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze
        run: npm install
        working-directory: sync-scripts
      - name: Esegui refresh.js (strutture ricettive)
        run: node refresh.js
        working-directory: sync-scripts
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Esegui refresh-ristoranti.js (ristoranti)
        run: node refresh-ristoranti.js
        working-directory: sync-scripts
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
